name: astrbot_plugin_lolmatch
display_name: LOL 赛事助手
desc: 查询英雄联盟职业赛事（LPL/LCK/世界赛等）的赛程、赛果与单场数据，支持订阅联赛后每晚自动推送当日战报与次日赛程，可 @全体 或 @指定人提醒，并可按「工作日 / 休息日」限定可提醒时段。赛程、比赛摘要与单局详情均可渲染成图片卡片（选手 KDA、经济、伤害、天赋符文、召唤师技能、出装、BP、龙塔资源一图看完），并带两队历史交手、单局小龙/团战时间线与联赛晋级图（一个赛段一张，按赛制自动选画法：单败对阵树、双败胜者组/败者组双轨、瑞士轮轮次跑道；淘汰赛右侧带最终名次面板与每队旅程线），今日/本周赛程带对局编号并附当前赛段晋级图，环境缺字体时自动退回纯文字。
short_desc: 查 LOL 赛程赛果与逐局数据，图片卡片 + 订阅推送 + @提醒
version: v1.10.0
author: szjm
repo: https://github.com/szjmhxd/astrbot_plugin_lolmatch
astrbot_version: ">=4.16,<5"
support_platforms:
  - aiocqhttp
  - kook
  - telegram
  - discord
  - lark
  - dingtalk
  - slack
  - wecom
