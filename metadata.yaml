name: astrbot_plugin_lolmatch
display_name: LOL 赛事助手
desc: 查询英雄联盟职业赛事（LPL/LCK/世界赛等）的赛程、赛果与单场数据，支持订阅联赛后每晚自动推送当日战报与次日赛程，可 @全体 或 @指定人提醒，并可按「工作日 / 休息日」限定可提醒时段。赛程、比赛摘要与单局详情均可渲染成图片卡片（选手 KDA、经济、伤害、天赋符文、召唤师技能、出装、BP、龙塔资源一图看完），并带两队历史交手与单局小龙/团战时间线，环境缺字体时自动退回纯文字。
short_desc: 查 LOL 赛程赛果与逐局数据，图片卡片 + 订阅推送 + @提醒
version: v1.4.1
author: szjm
repo: https://github.com/szjmhxd/astrbot_plugin_lolmatch
astrbot_version: ">=4.16,<5"
support_platforms:
  - aiocqhttp
  - kook
  - telegram
  - discord
  - lark
  - dingtalk
  - slack
  - wecom
