[tool.ruff]
line-length = 100
target-version = "py310"
exclude = ["__pycache__"]

[tool.ruff.lint]
# E/F/W 基础错误检查，I import 排序，UP 过时语法，B 常见坑
# 不开 RUF001-003：这个插件的注释和文案大量使用中文标点，开了只会刷屏
select = ["E", "F", "W", "I", "UP", "B", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["lol"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
